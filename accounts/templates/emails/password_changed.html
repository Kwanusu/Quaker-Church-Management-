{% extends "emails/base.html" %}
{% block content %}
<p>Hello {{ name }},</p>
<p>The password for your account <strong>{{ username }}</strong> was just changed, and you were signed out on other devices.</p>
<p>If this wasn’t you, <a href="{{ reset_url }}" style="color:#2a5a8c;font-weight:bold;">reset your password straight away</a>.</p>
{% endblock %}
