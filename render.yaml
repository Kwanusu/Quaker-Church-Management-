# Render Blueprint: the API (Docker, so ffmpeg is available) and a Redis-compatible Key Value store for live chat.
# The database is Supabase and uploaded files go to Supabase Storage, so neither is declared here.
# Values marked `sync: false` are asked for once in the Render dashboard when the Blueprint is created.
services:
  - type: web
    name: friends-portal-api
    runtime: docker
    plan: starter            # WebSockets and live streaming need an always-on instance
    branch: prod
    autoDeployTrigger: commit
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY   # encrypts stream keys at rest; generated once and kept across deploys
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: friends-portal-redis
          property: connectionString
      - key: DATABASE_URL           # Supabase -> Connect -> Session pooler
        sync: false
      - key: TENANT_BASE_DOMAIN     # your domain, e.g. friends.example.org: each church gets <slug>.<this>
        sync: false
      - key: TENANT_URL_SCHEME
        value: https
      - key: FRONTEND_URL           # https://<your domain> (the platform's own site)
        sync: false
      - key: CORS_ALLOWED_ORIGINS   # same origin as FRONTEND_URL; church subdomains are allowed automatically
        sync: false
      - key: API_PUBLIC_URL         # this service's https URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_BUCKET
        value: media
      - key: SUPABASE_S3_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: keyvalue
    name: friends-portal-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []             # reachable only from other Render services in the same account
